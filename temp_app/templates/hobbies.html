<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}
    <h1>My hobbies</h1>
    <p>Class: {{ grade }}</p>

    {% if grade == 12 %}
        <p>აბიტურიენტი</p>
    {% else %}
        <p>მომავალი აბიტურიენტი</p>
    {% endif %}

    {% for hobby in hobbies %}
        <p>{{ hobby }}</p>
    {% endfor %}
{% endblock %}
</body>
</html>
